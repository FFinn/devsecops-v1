rules:
  - id: python-sql-query-concat
    languages:
      - python
    severity: ERROR
    message: >-
      Возможная SQL-инъекция: SQL-запрос формируется конкатенацией строк.
      Используйте параметризованный запрос.
    metadata:
      category: security
      cwe:
        - "CWE-89"
      technology:
        - python
        - sqlite
    pattern-regex: >-
      (?i)\bquery\s*=\s*["'][^"']*(select|insert|update|delete)[^"']*["']\s*\+\s*[A-Za-z_][A-Za-z0-9_]*

  - id: python-sql-query-fstring
    languages:
      - python
    severity: ERROR
    message: >-
      Возможная SQL-инъекция: SQL-запрос формируется с помощью f-строки.
      Используйте параметризованный запрос.
    metadata:
      category: security
      cwe:
        - "CWE-89"
      technology:
        - python
        - sqlite
    pattern-regex: >-
      (?i)\bquery\s*=\s*f["'].*(select|insert|update|delete).*\{[A-Za-z_][A-Za-z0-9_]*\}.*["']
