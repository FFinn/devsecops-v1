default:
  tags:
    - docker
  before_script:
    - mkdir -p security-reports artifacts/ci

stages:
  - verify
  - build
  - gate
  - deploy_test
  - security
  - publish

variables:
  DAST_TARGET: "https://preview.owasp-juice.shop/"
  RUN_DAST: "true"
  SECURITY_DEMO_SCENARIO: "green"
  SAST_BLOCK_SEVERITIES: "ERROR"
  SCA_BLOCK_SEVERITIES: "HIGH,CRITICAL"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

.common_security_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

.dast_context_rules:
  rules:
    - if: '$RUN_DAST == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$RUN_DAST == "true" && $CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$RUN_DAST == "true" && $CI_PIPELINE_SOURCE == "web"'

sast_semgrep:
  extends: .common_security_rules
  stage: verify
  image:
    name: semgrep/semgrep:1.172.0
    entrypoint: [""]
  script:
    - semgrep --version | tee artifacts/ci/semgrep-version.txt
    - |
      SAST_TARGET="app"
      if [ "$SECURITY_DEMO_SCENARIO" = "red-sast" ]; then
        SAST_TARGET="security-fixtures/red-sast"
      fi
      echo "SAST target: $SAST_TARGET"
      semgrep scan \
        --config security/semgrep.yml \
        --json \
        --output security-reports/sast-report.json \
        "$SAST_TARGET"
    - test -s security-reports/sast-report.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security-reports/sast-report.json
      - artifacts/ci/semgrep-version.txt

sca_trivy:
  extends: .common_security_rules
  stage: build
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy --version | tee artifacts/ci/trivy-version.txt
    - |
      SCA_TARGET="."
      SKIP_ARGS="--skip-dirs security-fixtures"
      if [ "$SECURITY_DEMO_SCENARIO" = "red-sca" ]; then
        mkdir -p .sca-demo
        cp security-fixtures/red-sca/requirements.txt.fixture .sca-demo/requirements.txt
        SCA_TARGET=".sca-demo"
        SKIP_ARGS=""
      fi
      echo "SCA target: $SCA_TARGET"
      trivy fs \
        --scanners vuln \
        $SKIP_ARGS \
        --format json \
        --output security-reports/sca-report.json \
        "$SCA_TARGET"
      trivy fs \
        --scanners vuln \
        $SKIP_ARGS \
        --format cyclonedx \
        --output security-reports/sbom.json \
        "$SCA_TARGET"
    - test -s security-reports/sca-report.json
    - test -s security-reports/sbom.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security-reports/sca-report.json
      - security-reports/sbom.json
      - artifacts/ci/trivy-version.txt

gate_sast:
  extends: .common_security_rules
  stage: gate
  image: python:3.12-alpine
  needs:
    - job: sast_semgrep
      artifacts: true
  script:
    - python3 scripts/gate_sast.py security-reports/sast-report.json artifacts/ci/gate-sast.log
  allow_failure: false
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/ci/gate-sast.log

gate_sca:
  extends: .common_security_rules
  stage: gate
  image: python:3.12-alpine
  needs:
    - job: sca_trivy
      artifacts: true
  script:
    - python3 scripts/gate_sca.py security-reports/sca-report.json artifacts/ci/gate-sca.log
  allow_failure: false
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/ci/gate-sca.log

deploy_test:
  extends: .dast_context_rules
  stage: deploy_test
  image: alpine:3.22
  needs:
    - gate_sast
    - gate_sca
  script:
    - apk add --no-cache curl
    - |
      {
        echo "DAST_TARGET=$DAST_TARGET"
        echo "Checking external test/stage target..."
        curl \
          --fail \
          --silent \
          --show-error \
          --location \
          --retry 3 \
          --retry-delay 3 \
          --max-time 30 \
          --output /dev/null \
          --write-out "HTTP %{http_code}\n" \
          "$DAST_TARGET"
      } | tee artifacts/ci/dast-target.log
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/ci/dast-target.log

dast_zap_baseline:
  extends: .dast_context_rules
  stage: security
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  needs:
    - deploy_test
  timeout: 15m
  retry:
    max: 1
  script:
    - |
      set +e
      zap-baseline.py \
        -t "$DAST_TARGET" \
        -r dast-report.html \
        -J dast-report.json \
        -I \
        > "$CI_PROJECT_DIR/artifacts/ci/zap-baseline-log.txt" 2>&1
      ZAP_EXIT=$?
      set -e

      cat "$CI_PROJECT_DIR/artifacts/ci/zap-baseline-log.txt"

      if [ -f /zap/wrk/dast-report.html ]; then
        cp /zap/wrk/dast-report.html "$CI_PROJECT_DIR/security-reports/dast-report.html"
      elif [ -f dast-report.html ]; then
        cp dast-report.html "$CI_PROJECT_DIR/security-reports/dast-report.html"
      fi

      if [ -f /zap/wrk/dast-report.json ]; then
        cp /zap/wrk/dast-report.json "$CI_PROJECT_DIR/security-reports/dast-report.json"
      elif [ -f dast-report.json ]; then
        cp dast-report.json "$CI_PROJECT_DIR/security-reports/dast-report.json"
      fi

      {
        echo "policy=ZAP baseline findings are triaged; WARN findings are non-blocking"
        echo "blocking=explicit ZAP FAIL result, scanner execution failure, or missing required report"
        echo "zap_exit_code=$ZAP_EXIT"
      } > "$CI_PROJECT_DIR/artifacts/ci/gate-dast.log"

      if [ ! -s "$CI_PROJECT_DIR/security-reports/dast-report.html" ]; then
        echo "decision=BLOCK" >> "$CI_PROJECT_DIR/artifacts/ci/gate-dast.log"
        echo "reason=required DAST HTML report is missing" >> "$CI_PROJECT_DIR/artifacts/ci/gate-dast.log"
        exit 3
      fi

      case "$ZAP_EXIT" in
        0|2)
          echo "decision=PASS_TO_TRIAGE" >> "$CI_PROJECT_DIR/artifacts/ci/gate-dast.log"
          exit 0
          ;;
        1)
          echo "decision=BLOCK" >> "$CI_PROJECT_DIR/artifacts/ci/gate-dast.log"
          echo "reason=at least one ZAP rule is explicitly configured as FAIL" >> "$CI_PROJECT_DIR/artifacts/ci/gate-dast.log"
          exit 1
          ;;
        *)
          echo "decision=BLOCK" >> "$CI_PROJECT_DIR/artifacts/ci/gate-dast.log"
          echo "reason=ZAP execution failure" >> "$CI_PROJECT_DIR/artifacts/ci/gate-dast.log"
          exit "$ZAP_EXIT"
          ;;
      esac
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security-reports/dast-report.html
      - security-reports/dast-report.json
      - artifacts/ci/gate-dast.log
      - artifacts/ci/zap-baseline-log.txt

publish_security_bundle:
  extends: .dast_context_rules
  stage: publish
  image: python:3.12-alpine
  needs:
    - job: sast_semgrep
      artifacts: true
    - job: sca_trivy
      artifacts: true
    - job: gate_sast
      artifacts: true
    - job: gate_sca
      artifacts: true
    - job: dast_zap_baseline
      artifacts: true
  script:
    - |
      for file in \
        security-reports/sast-report.json \
        security-reports/sca-report.json \
        security-reports/sbom.json \
        security-reports/dast-report.html \
        security-reports/dast-report.json \
        artifacts/ci/gate-sast.log \
        artifacts/ci/gate-sca.log \
        artifacts/ci/gate-dast.log \
        artifacts/ci/zap-baseline-log.txt
      do
        test -s "$file"
      done
    - python3 scripts/generate_triage.py
    - |
      {
        echo "Security pipeline bundle"
        echo "commit=$CI_COMMIT_SHA"
        echo "ref=$CI_COMMIT_REF_NAME"
        echo "pipeline=$CI_PIPELINE_URL"
        echo "scenario=$SECURITY_DEMO_SCENARIO"
        echo "dast_target=$DAST_TARGET"
        echo
        echo "Reports:"
        find security-reports -maxdepth 1 -type f -print | sort
        echo
        echo "Gate logs:"
        find artifacts/ci -maxdepth 1 -name 'gate-*.log' -type f -print | sort
      } | tee artifacts/ci/security-bundle.txt
  artifacts:
    when: always
    expire_in: 30 days
    name: "security-bundle-$CI_COMMIT_SHORT_SHA"
    paths:
      - security-reports/
      - artifacts/ci/
